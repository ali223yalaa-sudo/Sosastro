# Astro private relay (nosflare on Cloudflare Workers + D1 + Durable Objects)
# Isolated worker — does not touch x-app-*, iraqmaps-*, dtsproxy.
# Deploy:  npx wrangler deploy   (from this directory, with CLOUDFLARE_API_TOKEN set)
name = "astro-relay"
compatibility_date = "2025-01-04"
main = "worker.js"

# Durable Objects binding (per-region WebSocket state + SQLite event storage)
[[durable_objects.bindings]]
name = "RELAY_WEBSOCKET"
class_name = "RelayWebSocket"

# D1 Database binding (Astro-owned, isolated from other projects)
[[d1_databases]]
binding = "RELAY_DATABASE"
database_name = "astro-relay-db"
database_id = "757e97ca-cf33-4bc8-b040-51251c23dd77"

# Cron trigger for 24h database maintenance
[triggers]
crons = ["0 0 * * *"]

# CPU limits (lower to 10 if not on the paid Workers plan)
[limits]
cpu_ms = 300000

[observability.logs]
enabled = false

# Durable Object migration with the SQLite storage backend
[[migrations]]
tag = "v4"
new_sqlite_classes = ["RelayWebSocket"]
